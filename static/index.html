<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LNA Hommes – Statistiques</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1b1f24; --muted: #6a7380; --line: #e3e6ea;
    --accent: #d6001c; --accent-soft: #fde8eb; --good: #1a7f4b; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --card: #1b1e23; --ink: #e8eaed; --muted: #98a1ad; --line: #2c3138;
            --accent: #ff4d5e; --accent-soft: #3a1d22; --good: #4cc38a; --bad: #ff7a70; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: baseline; gap: 4px 12px; padding-top: 14px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .lang { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; align-self: center; }
  .lang button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer; }
  .lang button.on { background: var(--accent); color: #fff; }
  nav { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  nav button { border: 0; background: none; padding: 10px 14px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 20px 0 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); max-width: 100%; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--card); }
  th.sort { cursor: pointer; user-select: none; }
  th.sort:hover { color: var(--ink); }
  th.active { color: var(--accent); }
  th.grp { text-align: center; border-bottom: 2px solid var(--line); }
  td.l, th.l { text-align: left; }
  tbody tr:hover { background: var(--accent-soft); }
  tr.click { cursor: pointer; }
  .num { color: var(--muted); }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .muted { color: var(--muted); }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .game:hover { border-color: var(--accent); }
  .game .date { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .game .row { display: flex; justify-content: space-between; gap: 8px; }
  .game .win { font-weight: 700; }
  .game .sets { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; }
  .week { margin: 18px 0 8px; font-weight: 600; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(1100px, 96vw); max-height: 92vh; background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 2; }
  .dlg-body { padding: 16px 18px; }
  .x { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  .score { font-size: 26px; font-weight: 700; }
  h3 { margin: 18px 0 8px; font-size: 15px; }
  a { color: var(--accent); }
  .legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .leaders { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 16px; }
  .leaders .card { margin: 0; padding: 14px 16px 10px; min-width: 0; }
  .leaders h2 { font-size: 15px; margin: 0; }
  .leaders .crit { font-size: 12px; color: var(--muted); margin: 2px 0 8px; min-height: 1em; }
  .lrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .lrow:hover .lname { color: var(--accent); }
  .lrow .rk { color: var(--muted); font-variant-numeric: tabular-nums; }
  .lrow .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .lteam { font-size: 12px; color: var(--muted); }
  .postag { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-weight: 400; }
  .postag.guess { border-style: dashed; font-style: italic; }
  .profile { display: flex; gap: 14px; align-items: center; }
  .profile img { width: 64px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--line); flex: none; }
  .lrow .lval { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .lrow .lsub { font-size: 11px; color: var(--muted); text-align: right; font-weight: 400; }
  .lrow .bar { grid-column: 2 / 4; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .lrow .bar i { display: block; height: 100%; background: var(--accent); }
  .lrow.first .lval { color: var(--accent); }
  td.heat { background: color-mix(in srgb, var(--c) calc(var(--a) * 100%), transparent); font-weight: 600; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .ranks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px; }
  .rankcard { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .rankcard .rkbig { font-size: 24px; font-weight: 800; min-width: 52px; text-align: center; color: var(--muted); }
  .rankcard.top { border-color: var(--accent); background: var(--accent-soft); }
  .rankcard.top .rkbig { color: var(--accent); }

  /* Téléphone */
  @media (max-width: 600px) {
    /* En-tête compact : titre et langue sur une ligne, méta sur une seule ligne tronquée */
    .top { padding-top: 10px; flex-wrap: nowrap; align-items: center; }
    h1 { font-size: 17px; flex: 1 1 auto; min-width: 0; white-space: nowrap; }
    h1 small { display: none; }
    .meta { display: none; }
    nav { margin-top: 2px; -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
    nav button { padding: 9px 10px; }
    .lrow .lname { white-space: normal; }
    /* Tableaux larges : la colonne des noms reste visible pendant le défilement horizontal */
    th.sc, td.sc { position: sticky; left: 0; z-index: 1; background: var(--card); white-space: normal; min-width: 110px; max-width: 130px;
                   box-shadow: 1px 0 0 var(--line); }
    tbody tr:hover td.sc { background: var(--accent-soft); }
    .setdetail { display: none; }
    main { padding-top: 14px; }
    .card { padding: 12px; }
    .toolbar select, .toolbar input:not([type=checkbox]) { flex: 1 1 140px; }
    .lrow .lsub { text-align: left; }
    dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0; }
    .dlg-head, .dlg-body { padding: 12px; }
    .score { font-size: 19px; }
    .profile img { width: 48px; height: 54px; }
    th, td { padding: 5px 6px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top"><h1 id="h1"></h1><div class="meta" id="meta"></div>
      <div class="lang" role="group" aria-label="Langue / Language"><button data-l="fr">FR</button><button data-l="en">EN</button></div></div>
    <nav id="tabs">
      <button data-tab="standings" class="on"></button>
      <button data-tab="leaders"></button>
      <button data-tab="teams"></button>
      <button data-tab="games"></button>
      <button data-tab="players"></button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<dialog id="dlg"><div class="dlg-head"><div id="dlg-title"></div><button class="x" onclick="dlg.close()" id="dlg-close">×</button></div><div class="dlg-body" id="dlg-body"></div></dialog>

<script>
// ---------- Langue ----------
// Chaque texte est écrit en paire L('français', 'english') et évalué au rendu :
// changer de langue redessine simplement la vue courante.
let lang = 'fr';
try { lang = localStorage.getItem('lang') || (navigator.language.startsWith('en') ? 'en' : 'fr'); } catch (e) {}
const L = (fr, en) => lang === 'en' ? en : fr;
const tr = x => Array.isArray(x) ? L(x[0], x[1]) : x;
const locale = () => L('fr-CH', 'en-GB');

const $ = s => document.querySelector(s);
const api = p => fetch('api/' + p).then(r => r.json());
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => new Date(d.replace(' ', 'T')).toLocaleDateString(locale(), {weekday: 'short', day: 'numeric', month: 'short'});
const fmtTime = d => d.slice(11, 16);
const pct = v => v == null ? '–' : v + '%';
const POS = { pass: ['Passeur', 'Setter'], diagonal: ['Diagonal', 'Opposite'], out: ['Ailier', 'Outside hitter'],
              middle: ['Central', 'Middle blocker'], libero: ['Libéro', 'Libero'] };
const posTag = r => r.position ? `<span class="postag${r.position_src === 'déduit' ? ' guess' : ''}"
  title="${r.position_src === 'déduit' ? L('Poste déduit des feuilles de match (absent de l’effectif officiel)', 'Position inferred from the match sheets (missing from the official roster)')
                                        : L('Poste selon l’effectif officiel', 'Position from the official roster')}">${tr(POS[r.position])}</span>` : '';
// Nom du pays : l'effectif officiel ne le donne qu'en allemand, français et italien.
// En anglais, on passe par le code ISO et Intl.DisplayNames.
const IOC_ISO = { ARG: 'AR', AUS: 'AU', AUT: 'AT', BEL: 'BE', BIH: 'BA', BRA: 'BR', BUL: 'BG', CAN: 'CA', CHI: 'CL', CHN: 'CN', COL: 'CO',
  CRO: 'HR', CUB: 'CU', CZE: 'CZ', DEN: 'DK', DOM: 'DO', EGY: 'EG', ESP: 'ES', EST: 'EE', FIN: 'FI', FRA: 'FR', GBR: 'GB', GER: 'DE', GRE: 'GR',
  HUN: 'HU', IRI: 'IR', ISR: 'IL', ITA: 'IT', JPN: 'JP', KOR: 'KR', LAT: 'LV', LTU: 'LT', MEX: 'MX', MNE: 'ME', NED: 'NL', NOR: 'NO', NZL: 'NZ',
  POL: 'PL', POR: 'PT', PUR: 'PR', ROU: 'RO', RSA: 'ZA', RUS: 'RU', SLO: 'SI', SRB: 'RS', SUI: 'CH', SVK: 'SK', SWE: 'SE', TUN: 'TN', TUR: 'TR',
  UKR: 'UA', USA: 'US', VEN: 'VE' };
const country = r => {
  if (lang !== 'en' || !IOC_ISO[r.nat_code]) return r.nationality || r.nat_code || '';
  try { return new Intl.DisplayNames(['en'], { type: 'region' }).of(IOC_ISO[r.nat_code]); } catch (e) { return r.nat_code; }
};
// Filtres poste / nationalité partagés par Stats joueurs et Joueurs
const posOptions = cur => `<option value="">${L('Tous les postes', 'All positions')}</option>${Object.entries(POS).map(([k, n]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${tr(n)}</option>`).join('')}`;
const natOptions = cur => [['', L('Toutes nationalités', 'All nationalities')], ['SUI', L('Suisses', 'Swiss')], ['foreign', L('Étrangers', 'Foreign')]]
  .map(([k, n]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${n}</option>`).join('');
const natMatch = (r, f) => !f || (f === 'SUI' ? r.nat_code === 'SUI' : r.nat_code && r.nat_code !== 'SUI');
// % affiché seulement s'il y a des tentatives (sinon le PDF indique 0 %)
const pctIf = tot => (v, r) => r && !r[tot] ? '<span class="muted">·</span>' : pct(v);
const sign = v => v == null ? '–' : `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${v > 0 ? '+' : ''}${v}</span>`;
const dash = v => v == null || v === 0 ? '<span class="muted">·</span>' : v;
let cache = {};
const load = async k => cache[k] ??= await api(k);

// ---------- Onglets ----------
const TABS = { standings: ['Classement', 'Standings'], leaders: ['Stats joueurs', 'Player stats'], teams: ['Stats équipes', 'Team stats'],
               games: ['Matchs', 'Matches'], players: ['Joueurs', 'Players'] };
const views = { standings: renderStandings, leaders: renderLeaders, games: renderGames, players: renderPlayers, teams: renderTeams };
let current = 'standings';
$('#tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  current = b.dataset.tab;
  b.scrollIntoView({ inline: 'nearest', block: 'nearest' });   // onglet visible sur mobile
  location.hash = current;
  views[current]();
};

// ---------- Classement ----------
async function renderStandings() {
  const rows = await load('standings');
  $('#view').innerHTML = `<div class="card scroll"><table>
    <thead><tr><th>#</th><th class="l sc">${L('Équipe', 'Team')}</th><th>${L('J', 'P')}</th><th>Pts</th><th>${L('V', 'W')}</th><th>${L('D', 'L')}</th>
      <th>Sets</th><th>${L('Q sets', 'Set ratio')}</th><th>${L('Balles', 'Points')}</th><th>${L('Q balles', 'Point ratio')}</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="click" onclick="openTeam(${r.team_id})">
      <td class="num">${i + 1}</td><td class="l sc"><b>${esc(r.name)}</b></td><td>${r.games}</td><td><b>${r.pts}</b></td>
      <td>${r.w}</td><td>${r.l}</td><td>${r.sets_w}:${r.sets_l}</td><td>${(r.sets_w / Math.max(r.sets_l, 1)).toFixed(2)}</td>
      <td>${r.balls_w}:${r.balls_l}</td><td>${(r.balls_w / Math.max(r.balls_l, 1)).toFixed(2)}</td></tr>`).join('')}
    </tbody></table>
    <div class="legend">${L('Calculé à partir des résultats importés. 3-0 / 3-1 : 3 pts · 3-2 : 2 pts · 2-3 : 1 pt.',
                           'Computed from the imported results. 3-0 / 3-1: 3 pts · 3-2: 2 pts · 2-3: 1 pt.')}
      ${updateInfo() ? `<br>${L('Mise à jour automatique toutes les heures : ', 'Updated automatically every hour: ')}${updateInfo()}.` : ''}</div></div>`;
}

// ---------- Matchs ----------
let gfilter = 'all';
async function renderGames() {
  const games = await load('games');
  const weeks = {};
  for (const g of games) {
    const d = new Date(g.play_date.slice(0, 10)); const monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    (weeks[monday.toISOString().slice(0, 10)] ??= []).push(g);
  }
  const played = g => g.home_sets != null;
  $('#view').innerHTML = `<div class="toolbar"><div class="chips">${[['all', L('Tous', 'All')], ['played', L('Joués', 'Played')], ['next', L('À venir', 'Upcoming')]]
      .map(([k, n]) => `<button class="chip ${gfilter === k ? 'on' : ''}" data-f="${k}">${n}</button>`).join('')}</div></div>
    <div id="glist"></div>`;
  const draw = () => {
    const f = gfilter;
    $('#glist').innerHTML = Object.entries(weeks).map(([w, gs]) => {
      gs = gs.filter(g => f === 'all' || (f === 'played') === played(g));
      if (!gs.length) return '';
      const wd = new Date(w).toLocaleDateString(locale(), {day: 'numeric', month: 'long'});
      return `<div class="week">${L('Semaine du ' + wd, 'Week of ' + wd)}</div><div class="games">${gs.map(g => {
        const sets = JSON.parse(g.set_results || '[]');
        const hw = g.home_sets > g.away_sets;
        return `<div class="game" onclick="${played(g) ? `openGame(${g.game_id})` : ''}">
          <div class="date">${fmtDate(g.play_date)} · ${fmtTime(g.play_date)} · ${esc(g.city || '')}${g.stats_status === 'ok' ? '<span class="tag">stats</span>' : ''}</div>
          <div class="row ${played(g) && hw ? 'win' : ''}"><span>${esc(g.home)}</span><span>${g.home_sets ?? ''}</span></div>
          <div class="row ${played(g) && !hw ? 'win' : ''}"><span>${esc(g.away)}</span><span>${g.away_sets ?? ''}</span></div>
          ${sets.length ? `<div class="sets">${sets.map(s => s.join('-')).join(' · ')}</div>` : ''}</div>`;
      }).join('')}</div>`;
    }).join('') || `<div class="empty">${L('Aucun match', 'No matches')}</div>`;
  };
  document.querySelectorAll('.chip[data-f]').forEach(c => c.onclick = () => {
    gfilter = c.dataset.f;
    document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.toggle('on', x === c)); draw();
  });
  draw();
}

// Colonnes du tableau de stats d'un match (feuille officielle) : [clé, libellé, format, groupe]
const BOX = [
  ['pts_tot', 'Pts'], ['bp', 'BP'], ['wl', ['V-D', '+/-'], sign],
  ['srv_tot', 'Tot', null, ['Service', 'Serve']], ['srv_err', 'Err'], ['srv_pts', 'Ace'],
  ['rec_tot', 'Tot', null, ['Réception', 'Reception']], ['rec_err', 'Err'], ['rec_pos_pct', 'Pos%', pctIf('rec_tot')], ['rec_exc_pct', 'Exc%', pctIf('rec_tot')],
  ['att_tot', 'Tot', null, ['Attaque', 'Attack']], ['att_err', 'Err'], ['att_blo', 'Blo'], ['att_pts', 'Pts'], ['att_pct', 'Pts%', pctIf('att_tot')],
  ['blk_pts', 'Pts', null, ['Bloc', 'Block']],
];
function groupHeader(cols, lead) {
  const groups = []; for (const c of cols) { if (c[3] || !groups.length) groups.push([tr(c[3]) || '', 0]); groups.at(-1)[1]++; }
  return `<tr><th colspan="${lead}" class="${lead === 1 ? 'sc' : ''}"></th>${groups.map(([n, k]) => `<th class="grp" colspan="${k}">${n}</th>`).join('')}</tr>`;
}

async function openGame(id) {
  const g = await api('games/' + id);
  const sets = JSON.parse(g.set_results || '[]');
  $('#dlg-title').innerHTML = `<div class="muted">${fmtDate(g.play_date)} ${fmtTime(g.play_date)} · ${esc(g.hall || '')}, ${esc(g.city || '')}</div>
    <div class="score">${esc(g.home)} ${g.home_sets} : ${g.away_sets} ${esc(g.away)}</div>
    <div class="muted">${sets.map(s => s.join('-')).join(' · ')}${g.referees ? ' · ' + L('Arbitres : ', 'Referees: ') + esc(g.referees) : ''}</div>`;
  if (g.stats_status !== 'ok') {
    $('#dlg-body').innerHTML = `<div class="empty">${L('Feuille de statistiques pas encore disponible.', 'Statistics sheet not available yet.')}</div>`; return dlg.showModal();
  }
  const side = (tid, name) => {
    const ps = g.players.filter(p => p.team_id === tid && (p.pts_tot || p.srv_tot || p.rec_tot || p.att_tot || p.sets_played));
    const tot = g.team_sets.find(t => t.team_id === tid && t.set_no === 0);
    const perSet = g.team_sets.filter(t => t.team_id === tid && t.set_no > 0);
    return `<h3>${esc(name)}</h3><div class="scroll"><table>
      <thead>${groupHeader(BOX, 4)}<tr><th>${L('N°', 'No.')}</th><th class="l sc">${L('Joueur', 'Player')}</th><th>Sets</th><th>${L('Note', 'Rating')}</th>${BOX.map(c => `<th>${tr(c[1])}</th>`).join('')}</tr></thead>
      <tbody>${ps.map(p => `<tr class="click" onclick="openPlayer(${p.player_id})"><td class="num">${p.number}${p.libero ? ' L' : ''}</td>
        <td class="l sc">${esc(p.name)} ${posTag(p)}</td><td>${p.sets_played || '<span class="muted">·</span>'}</td><td>${p.vote ?? '<span class="muted">·</span>'}</td>
        ${BOX.map(c => `<td>${(c[2] || dash)(p[c[0]], p)}</td>`).join('')}</tr>`).join('')}
      <tr><td></td><td class="l sc"><b>Total</b></td><td></td><td></td>${BOX.map(c => `<td><b>${(c[2] || (v => v ?? 0))(tot[c[0]])}</b></td>`).join('')}</tr>
      ${perSet.map(s => `<tr class="muted"><td></td><td class="l sc">Set ${s.set_no} <span class="muted setdetail">(${L(
          `pts : ${s.won_srv} serv · ${s.won_att} att · ${s.won_blk} bloc · ${s.won_op_err} fautes adv.`,
          `pts: ${s.won_srv} serve · ${s.won_att} att · ${s.won_blk} block · ${s.won_op_err} opp. errors`)})</span></td><td></td><td></td>
        <td></td><td></td><td></td>${BOX.slice(3).map(c => `<td>${(c[2] || dash)(s[c[0]], s)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
  };
  $('#dlg-body').innerHTML = side(g.home_team_id, g.home) + side(g.away_team_id, g.away) +
    `<div class="legend">${L('BP : points en break-point · V-D : points gagnés − perdus · Pos% : réceptions positives (#+) · Exc% : parfaites (#) · Blo : attaques contrées.',
                             'BP: break points · +/-: points won − lost · Pos%: positive receptions (#+) · Exc%: perfect (#) · Blo: attacks blocked.')}
     <a href="pdf/${g.game_id}" target="_blank">${L('Feuille officielle (PDF)', 'Official sheet (PDF)')}</a></div>`;
  dlg.showModal();
}

// ---------- Joueurs ----------
const PCOLS = {
  general: [['games', ['MJ', 'GP']], ['sets', 'Sets'], ['pts', 'Pts'], ['pts_s', 'Pts/set'], ['bp', 'BP'], ['wl', ['V-D', '+/-'], sign], ['att_pts', 'Att'], ['srv_pts', 'Aces'], ['blk_pts', ['Blocs', 'Blocks']], ['vote', ['Note', 'Rating']]],
  attack: [['sets', 'Sets'], ['att_tot', 'Tot'], ['att_pts', 'Pts'], ['att_s', 'Pts/set'], ['att_err', 'Err'], ['att_blo', ['Contrés', 'Blocked']], ['att_pct', 'Pts%', pct], ['att_eff', 'Eff%', pct]],
  serve: [['sets', 'Sets'], ['srv_tot', 'Tot'], ['srv_pts', 'Aces'], ['ace_s', 'Aces/set'], ['srv_err', 'Err'], ['ace_pct', 'Ace%', pct], ['err_pct', 'Err%', pct]],
  reception: [['sets', 'Sets'], ['rec_tot', 'Tot'], ['rec_err', 'Err'], ['rec_pos_pct', 'Pos%', pct], ['rec_exc_pct', 'Exc%', pct], ['rec_err_pct', 'Err%', pct]],
  block: [['games', ['MJ', 'GP']], ['sets', 'Sets'], ['blk_pts', ['Blocs', 'Blocks']], ['blk_s', ['Blocs/set', 'Blocks/set']]],
};
const PCATS = [['general', ['Général', 'Overall']], ['attack', ['Attaque', 'Attack']], ['serve', ['Service', 'Serve']], ['reception', ['Réception', 'Reception']], ['block', ['Bloc', 'Block']]];
const PMIN = { attack: ['att_tot', 20], serve: ['srv_tot', 15], reception: ['rec_tot', 20] };
const VOLNAME = { att_tot: ['attaques', 'attacks'], srv_tot: ['services', 'serves'], rec_tot: ['réceptions', 'receptions'] };
const PDEF = { general: 'pts', attack: 'att_eff', serve: 'srv_pts', reception: 'rec_pos_pct', block: 'blk_pts' };
const pstate = { cat: 'general', sort: 'pts', dir: -1, team: '', q: '', min: true, pos: '', nat: '' };

// ---------- Classements statistiques (toute la ligue) ----------
// count : statistique cumulable, affichée en total, par set ou par match selon le mode.
// vol : colonne de volume pour les % (au moins VOL_SHARE du volume du leader de la ligue).
// Hors totaux, un joueur doit en plus avoir joué une part minimale des sets de son équipe.
const VOL_SHARE = 0.4;
const fix = d => v => v == null ? '–' : v.toFixed(d);
const LEADERS = [
  { t: ['Points', 'Points'], k: 'pts', count: true, sub: r => L(`${r.pts} pts : ${r.att_pts} att · ${r.srv_pts} aces · ${r.blk_pts} contres`, `${r.pts} pts: ${r.att_pts} att · ${r.srv_pts} aces · ${r.blk_pts} blocks`) },
  { t: ['Points en attaque', 'Attack points'], k: 'att_pts', count: true, sub: r => L(`${r.att_pts} pts sur ${r.att_tot} attaques`, `${r.att_pts} pts from ${r.att_tot} attacks`) },
  { t: ['Efficacité en attaque', 'Attack efficiency'], k: 'att_eff', f: pct, vol: 'att_tot', sub: r => L(`${r.att_pts} pts · ${r.att_err + r.att_blo} fautes/contrés · ${r.att_tot} att.`, `${r.att_pts} pts · ${r.att_err + r.att_blo} errors/blocked · ${r.att_tot} att.`) },
  { t: ['Réussite en attaque', 'Kill percentage'], k: 'att_pct', f: pct, vol: 'att_tot', sub: r => `${r.att_pts}/${r.att_tot}` },
  { t: ['Aces', 'Aces'], k: 'srv_pts', count: true, sub: r => L(`${r.srv_pts} aces · ${r.srv_tot} services · ${r.srv_err} fautes`, `${r.srv_pts} aces · ${r.srv_tot} serves · ${r.srv_err} errors`) },
  { t: ['Points au contre', 'Block points'], k: 'blk_pts', count: true, sub: r => L(`${r.blk_pts} contres`, `${r.blk_pts} blocks`) },
  { t: ['Réception positive', 'Positive reception'], k: 'rec_pos_pct', f: pct, vol: 'rec_tot', sub: r => L(`${r.rec_tot} réceptions · ${r.rec_err} fautes`, `${r.rec_tot} receptions · ${r.rec_err} errors`) },
  { t: ['Réception parfaite', 'Perfect reception'], k: 'rec_exc_pct', f: pct, vol: 'rec_tot', sub: r => L(`${r.rec_tot} réceptions`, `${r.rec_tot} receptions`) },
  { t: ['Points en break-point', 'Break points'], k: 'bp', count: true, sub: r => L(`${r.bp} BP sur ${r.pts} pts`, `${r.bp} BP out of ${r.pts} pts`) },
  { t: ['Différentiel V-D', 'Plus/minus'], k: 'wl', count: true, signed: true, sub: r => L(`${r.wl > 0 ? '+' : ''}${r.wl} au total`, `${r.wl > 0 ? '+' : ''}${r.wl} in total`) },
  { t: ['Note moyenne Data Volley', 'Average Data Volley rating'], k: 'vote', f: fix(1), sub: () => '' },
];
const MODES = { total: [['Totaux', 'Totals'], ['', ''], null], set: [['Par set', 'Per set'], [' par set', ' per set'], 'sets'], match: [['Par match', 'Per match'], [' par match', ' per match'], 'games'] };
const lstate = { top: 10, team: '', mode: 'set', part: 0.5, pos: '', nat: '' };
const setsGames = r => L(`${r.sets}/${r.team_sets}&nbsp;sets · ${r.games}&nbsp;m.`, `${r.sets}/${r.team_sets}&nbsp;sets · ${r.games}&nbsp;gp`);

// Règles communes aux classements (onglet Stats joueurs et fiche joueur) : mode et minimums de lstate
function leaderRules(c, all) {
  const [, suffix, denom] = MODES[lstate.mode];
  const rate = c.count && denom;
  const needPart = !(c.count && lstate.mode === 'total');
  // Seuils calculés sur toute la ligue, même quand on filtre une équipe
  const volMin = c.vol ? Math.ceil(VOL_SHARE * Math.max(...all.map(r => r[c.vol] || 0))) : 0;
  return {
    title: tr(c.t) + (c.count ? tr(suffix) : ''), needPart, volMin,
    val: r => rate ? r[c.k] / Math.max(r[denom], 1) : r[c.k],
    fmt: rate ? (v => (c.signed && v > 0 ? '+' : '') + v.toFixed(denom === 'sets' ? 2 : 1)) : c.signed ? sign : (c.f || (v => v)),
  };
}
// Joueurs classables pour un classement, du meilleur au moins bon
function leaderList(c, all) {
  const R = leaderRules(c, all);
  return all.filter(r => r[c.k] != null && (!R.needPart || r.sets >= lstate.part * r.team_sets) && (!c.vol || r[c.vol] >= R.volMin))
    .map(r => ({ r, v: R.val(r) })).sort((a, b) => b.v - a.v || b.r.sets - a.r.sets);
}
const ordinal = n => L(n === 1 ? '1er' : `${n}e`, n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'));

      <select id="lteam"><option value="">${L('Toute la LNA', 'Whole NLA')}</option>${teams.map(t => `<option value="${t.team_id}" ${lstate.team == t.team_id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
      <select id="lpos">${posOptions(lstate.pos)}</select><select id="lnat">${natOptions(lstate.nat)}</select>
      <label class="muted">${L('Minimum', 'Minimum')} <select id="lpart">${[[0, L('aucun', 'none')], [0.25, '25 %'], [0.5, '50 %'], [0.75, '75 %']]
        .map(([v, n]) => `<option value="${v}" ${lstate.part === v ? 'selected' : ''}>${n}</option>`).join('')}</select> ${L("des sets de l'équipe", 'of team sets')}</label>
      <div class="chips" id="ltop">${[5, 10, 20].map(n => `<button class="chip ${lstate.top === n ? 'on' : ''}" data-n="${n}">Top ${n}</button>`).join('')}</div>
    </div><div class="leaders" id="lgrid"></div>

      Hors totaux, un joueur doit avoir joué la part minimale choisie des sets disputés par son équipe ; les classements en % exigent en plus
      ${Math.round(VOL_SHARE * 100)} % du volume du joueur le plus sollicité de la ligue. Efficacité en attaque = (points − fautes − contrés) / attaques.`,
      `Sets played = sets started or entered as a substitute (official sheet); an unmarked libero is counted for the whole match.
      Except for totals, a player must have played the selected share of his team's sets; percentage rankings also require

  const draw = () => {

          && (!lstate.pos || r.position === lstate.pos) && natMatch(r, lstate.nat)).slice(0, lstate.top);
      const max = Math.max(...list.map(x => x.v), 1e-9);
      const share = Math.round(lstate.part * 100);
      const crit = [needPart && lstate.part ? L(`${share} % des sets de l'équipe`, `${share}% of team sets`) : '', c.vol ? `${volMin} ${tr(VOLNAME[c.vol])}` : '']
        .filter(Boolean).join(' · ');
      return `<div class="card"><h2>${title}</h2><div class="crit">${crit ? 'min. ' + crit : ''}</div>
        ${list.map(({ r, v }, i) => `<div class="lrow${i ? '' : ' first'}" onclick="openPlayer(${r.player_id})">
          <span class="rk">${i + 1}</span>
          <span class="lname"><b>${esc(r.name)}</b> ${posTag(r)} <span class="lteam">${esc(r.team)}</span></span>
          <span class="lval">${f(v)}</span>
          <span></span><span class="lsub" style="grid-column: 2 / 4">${[c.sub(r), setsGames(r)].filter(Boolean).join(' · ')}</span>
          <span class="bar"><i style="width:${Math.max(0, 100 * v / max)}%"></i></span>
        </div>`).join('') || `<div class="empty">${L('Aucun joueur', 'No players')}</div>`}</div>`;

  $('#lpos').onchange = e => { lstate.pos = e.target.value; draw(); };

// Ratios dérivés, calculés une fois sur la liste mise en cache
async function loadPlayers() {
  const rows = await load('players');
  if (!rows.enriched) {
    for (const r of rows) {
      const s = Math.max(r.sets, 1);
      r.pts_s = +(r.pts / s).toFixed(2); r.att_s = +(r.att_pts / s).toFixed(2);
      r.ace_s = +(r.srv_pts / s).toFixed(2); r.blk_s = +(r.blk_pts / s).toFixed(2);
      r.ace_pct = r.srv_tot ? Math.round(100 * r.srv_pts / r.srv_tot) : null;
      r.err_pct = r.srv_tot ? Math.round(100 * r.srv_err / r.srv_tot) : null;
      r.rec_err_pct = r.rec_tot ? Math.round(100 * r.rec_err / r.rec_tot) : null;
    }
    rows.enriched = true;
  }
  return rows;
}

      ${cols.map(c => `<th class="sort ${pstate.sort === c[0] ? 'active' : ''}" data-s="${c[0]}">${tr(c[1])}${pstate.sort === c[0] ? (pstate.dir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead>
      <tbody>${list.map((r, i) => `<tr class="click" onclick="openPlayer(${r.player_id})"><td class="num">${i + 1}</td>
        <td class="l sc"><b>${esc(r.name)}</b> <span class="muted">${r.number ?? ''}</span></td><td class="l">${posTag(r)}</td>
        <td class="l muted" title="${esc(country(r))}">${r.nat_code || ''}</td><td class="l muted">${esc(r.team)}</td>
        ${cols.map(c => `<td>${(c[2] || (v => v ?? '–'))(r[c[0]])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="20" class="empty">${L('Aucun joueur', 'No players')}</td></tr>`}
      </tbody></table>
      ${min && pstate.min ? `<div class="legend">${L('Volume minimum', 'Minimum volume')} : ${min[1]} ${tr(VOLNAME[min[0]])}.</div>` : ''}
      <div class="legend">${L('Eff% attaque = (points − erreurs − contrés) / tentatives. Pos%/Exc% réception pondérés par le nombre de réceptions.',
                             'Attack Eff% = (kills − errors − blocked) / attempts. Reception Pos%/Exc% weighted by number of receptions.')}</div>`;
    document.querySelectorAll('#ptable th.sort').forEach(th => th.onclick = () => {

  };

  $('#pnat').onchange = e => { pstate.nat = e.target.value; draw(); };

  draw();
}

// Les 3 classements où le joueur est le mieux placé (rang de compétition : ex-aequo au même rang)
function bestRanks(id, all) {
  const out = [];
  for (const c of LEADERS) {
    const list = leaderList(c, all), me = list.find(x => x.r.player_id === id);
    if (!me) continue;
    const R = leaderRules(c, all), rank = 1 + list.filter(x => x.v > me.v).length;
    // Seulement les classements qui le distinguent : valeur non nulle et première moitié
    // (évite « 43e aux aces » pour un libéro qui ne sert pas)
    if (me.v > 0 && rank <= Math.ceil(list.length / 2))
      out.push({ title: R.title, value: R.fmt(me.v), rank, n: list.length });
  }
  return out.sort((a, b) => a.rank - b.rank || a.rank / a.n - b.rank / b.n).slice(0, 3);
}

async function openPlayer(id) {
  const [p, all] = await Promise.all([api('players/' + id), loadPlayers()]);
  const best = bestRanks(id, all);
  const share = Math.round(lstate.part * 100), modeName = tr(MODES[lstate.mode][0]).toLowerCase();
  const ranksHtml = best.length ? `<div class="ranks">${best.map(b => `<div class="rankcard${b.rank === 1 ? ' top' : ''}">
      <div class="rkbig">${ordinal(b.rank)}</div><div><b>${b.title}</b><div class="muted">${b.value} · ${L(`sur ${b.n} classés`, `of ${b.n} ranked`)}</div></div></div>`).join('')}</div>
    <div class="legend">${L(`Meilleurs classements dans la ligue (${modeName}, min. ${share} % des sets de l'équipe), selon les réglages de Stats joueurs.`,
                           `Best league rankings (${modeName}, min. ${share}% of team sets), following the Player stats settings.`)}</div>`
    : all.some(r => r.player_id === id && r.sets >= lstate.part * r.team_sets)
      ? `<div class="legend">${L('Pas encore dans la première moitié d’un classement de la ligue.', 'Not yet in the top half of any league ranking.')}</div>`
      : `<div class="legend">${L('Pas encore assez de temps de jeu pour figurer dans les classements de la ligue.', 'Not enough playing time yet to appear in the league rankings.')}</div>`;
  const facts = [p.position && tr(POS[p.position]) + (p.position_src === 'déduit' ? L(' (déduit des feuilles)', ' (inferred from match sheets)') : ''),
    country(p), p.birth_year && L(`né en ${p.birth_year}`, `born ${p.birth_year}`), p.height && `${p.height} cm`].filter(Boolean).join(' · ');
  $('#dlg-title').innerHTML = `<div class="profile">${p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy">` : ''}
    <div><div class="score">${esc(p.name)}</div><div class="muted">${esc(p.team)}${facts ? ' · ' + esc(facts) : ''}</div></div></div>`;
  const tot = k => p.games.reduce((s, g) => s + (g[k] || 0), 0);
  $('#dlg-body').innerHTML = `${ranksHtml}<h3>${L('Match par match', 'Match by match')}</h3><div class="scroll"><table>
    <thead>${groupHeader(BOX, 4)}<tr><th class="l sc">Date</th><th class="l">${L('Adversaire', 'Opponent')}</th><th>Sets</th><th>${L('Note', 'Rating')}</th>${BOX.map(c => `<th>${tr(c[1])}</th>`).join('')}</tr></thead>
    <tbody>${p.games.map(g => {
      const home = g.home_team_id === g.team_id, my = home ? g.home_sets : g.away_sets, their = home ? g.away_sets : g.home_sets;
      return `<tr class="click" onclick="openGame(${g.game_id})"><td class="l sc">${fmtDate(g.play_date)}</td>
        <td class="l">${home ? '' : '@ '}${esc(g.opponent)} <span class="${my > their ? 'pos' : 'neg'}">${my}-${their}</span></td>
        <td>${g.sets_played || '<span class="muted">·</span>'}</td><td>${g.vote ?? '<span class="muted">·</span>'}</td>
        ${BOX.map(c => `<td>${(c[2] || dash)(g[c[0]], g)}</td>`).join('')}</tr>`;
    }).join('')}
    <tr><td class="l sc"><b>Total</b></td><td></td><td><b>${tot('sets_played')}</b></td><td></td>${BOX.map(c => `<td><b>${c[2] ? '' : tot(c[0])}</b></td>`).join('')}</tr>
    </tbody></table></div>`;
  dlg.showModal();
}

// ---------- Stats équipes ----------

const TLEAD = [

  { t: ['Fautes de service', 'Service errors'], k: 'srv_err_pct', f: pct, asc: true, sub: r => L(`${r.srv_err} fautes sur ${r.srv_tot} services`, `${r.srv_err} errors from ${r.srv_tot} serves`) },
  { t: ['Réception positive', 'Positive reception'], k: 'rec_pos_pct', f: pct, sub: r => L(`${r.rec_tot} réceptions · ${r.rec_err} fautes`, `${r.rec_tot} receptions · ${r.rec_err} errors`) },
  { t: ['Réception parfaite', 'Perfect reception'], k: 'rec_exc_pct', f: pct, sub: r => L(`${r.rec_tot} réceptions`, `${r.rec_tot} receptions`) },
  { t: ['Attaque adverse (défense + contre)', 'Opponent attack (defence + block)'], k: 'opp_att_eff', f: pct, asc: true, sub: r => L(`efficacité adverse · ${r.opp_att_tot} attaques subies`, `opponent efficiency · ${r.opp_att_tot} attacks faced`) },
  { t: ['Fautes directes offertes', 'Unforced errors given'], k: 'err_given', count: true, asc: true, sub: r => L(`${r.err_given} points donnés à l'adversaire`, `${r.err_given} points given to the opponent`) },
  { t: ['Side-out', 'Side-out'], k: 'so_pct', f: pct, sub: r => L(`${r.so_pts} pts sur ${r.rec} réceptions · 1 pt toutes les ${(r.rec / r.so_pts).toFixed(2)} réc.`, `${r.so_pts} pts from ${r.rec} receptions · 1 pt every ${(r.rec / r.so_pts).toFixed(2)} rec.`) },
  { t: ['Break-point', 'Break point'], k: 'bp_pct', f: pct, sub: r => L(`${r.bp_pts} pts sur ${r.srv} services · 1 pt tous les ${(r.srv / r.bp_pts).toFixed(2)} serv.`, `${r.bp_pts} pts from ${r.srv} serves · 1 pt every ${(r.srv / r.bp_pts).toFixed(2)} serves`) },
  { t: ['Attaque après réception positive', 'Attack after positive reception'], k: 'pos_eff', f: pct, sub: r => `eff. · ${r.pos_pts} pts / ${r.pos_tot} att. (${pct(r.pos_kill)})` },
  { t: ['Attaque après réception négative', 'Attack after negative reception'], k: 'neg_eff', f: pct, sub: r => `eff. · ${r.neg_pts} pts / ${r.neg_tot} att. (${pct(r.neg_kill)})` },
  { t: ['Contre-attaque (attaque sur défense)', 'Transition attack (after a dig)'], k: 'dig_eff', f: pct, sub: r => `eff. · ${r.dig_pts} pts / ${r.dig_tot} att. (${pct(r.dig_kill)})` },
];
const tstate = { mode: 'set' };

async function renderTeams() {
  const rows = await load('teams');
  for (const r of rows) {
    r.diff = r.pts_won - r.pts_lost;
    r.srv_err_pct = r.srv_tot ? Math.round(100 * r.srv_err / r.srv_tot) : null;
    r.opp_att_eff = r.opp_att_tot ? Math.round(100 * (r.opp_att_pts - r.opp_att_fail) / r.opp_att_tot) : null;
    r.so_pct = r.rec ? Math.round(100 * r.so_pts / r.rec) : null;
    r.bp_pct = r.srv ? Math.round(100 * r.bp_pts / r.srv) : null;
    for (const b of ['pos', 'neg', 'dig']) {
      const tot = r[b + '_tot'];
      r[b + '_kill'] = tot ? Math.round(100 * r[b + '_pts'] / tot) : null;
      r[b + '_eff'] = tot ? Math.round(100 * (r[b + '_pts'] - r[b + '_err'] - r[b + '_blo']) / tot) : null;
    }
  }
  $('#view').innerHTML = `<div class="toolbar"><div class="chips" id="tmode">${Object.entries(MODES)
      .map(([k, m]) => `<button class="chip ${tstate.mode === k ? 'on' : ''}" data-m="${k}">${tr(m[0])}</button>`).join('')}</div></div>
    <div class="leaders" id="tgrid"></div>
    <div class="legend">${L(`Calculé sur les feuilles de statistiques importées. Points marqués et concédés = « balles » du classement officiel.
      Fautes directes offertes = points marqués par l'adversaire sur nos fautes (service, attaque, filet…). Attaque adverse : plus c'est bas, meilleure est la défense.`,
      `Computed from the imported statistics sheets. Points scored and conceded match the official standings.
      Unforced errors given = points the opponent scored from our errors (serve, attack, net…). Opponent attack: the lower, the better the defence.`)}</div>
    <h3>${L('Bilan par rotation', 'Rotation breakdown')}</h3><div class="card scroll" id="trot"></div>
    <h3>${L('Tableau complet', 'Full table')}</h3><div class="card scroll" id="ttable"></div>`;
  let draw = () => {
    const [, suffix, denom] = MODES[tstate.mode];
    $('#tgrid').innerHTML = TLEAD.map(c => {
      const rate = c.count && denom;
      const val = r => rate ? r[c.k] / Math.max(r[denom], 1) : r[c.k];
      const f = rate ? (v => (c.signed && v > 0 ? '+' : '') + v.toFixed(denom === 'sets' ? 2 : 1)) : c.signed ? sign : (c.f || (v => v));
      const list = rows.filter(r => r[c.k] != null).map(r => ({ r, v: val(r) })).sort((a, b) => (c.asc ? a.v - b.v : b.v - a.v));
      const lo = Math.min(0, ...list.map(x => x.v)), hi = Math.max(...list.map(x => x.v), 1e-9);
      // Barre : meilleure équipe = barre pleine, y compris pour les stats « plus bas = mieux »
      const width = v => c.asc ? 100 * Math.min(...list.map(x => x.v)) / Math.max(v, 1e-9) : 100 * (v - lo) / Math.max(hi - lo, 1e-9);
      return `<div class="card"><h2>${tr(c.t)}${c.count ? tr(suffix) : ''}</h2><div class="crit">${c.asc ? L('plus bas = mieux', 'lower is better') : ''}</div>
        ${list.map(({ r, v }, i) => `<div class="lrow${i ? '' : ' first'}" onclick="openTeam(${r.team_id})">
          <span class="rk">${i + 1}</span><span class="lname"><b>${esc(r.name)}</b></span><span class="lval">${f(v)}</span>
          <span></span><span class="lsub" style="grid-column: 2 / 4">${c.sub(r)} · ${r.sets}&nbsp;sets · ${r.games}&nbsp;${L('m.', 'gp')}</span>
          <span class="bar"><i style="width:${Math.max(0, width(v))}%"></i></span></div>`).join('')}</div>`;
    }).join('');
  };
  document.querySelectorAll('#tmode .chip').forEach(c => c.onclick = () => {
    tstate.mode = c.dataset.m; document.querySelectorAll('#tmode .chip').forEach(x => x.classList.toggle('on', x === c)); draw();
  });
  const drawRot = () => {
    const [, suffix, denom] = MODES[tstate.mode];
    const v = (r, i) => denom ? r['rot' + i] / Math.max(r[denom], 1) : r['rot' + i];
    const fmt = x => (x > 0 ? '+' : '') + (denom ? x.toFixed(denom === 'sets' ? 2 : 1) : x);
    const peak = Math.max(...rows.flatMap(r => [1, 2, 3, 4, 5, 6].map(i => Math.abs(v(r, i)))), 1e-9);
    const sortedRot = rows.slice().sort((a, b) => b.diff - a.diff);
    $('#trot').innerHTML = `<table><thead><tr><th class="l sc">${L('Équipe', 'Team')}</th>${[1, 2, 3, 4, 5, 6].map(i => `<th>P${i}</th>`).join('')}<th>${L('Meilleure', 'Best')}</th><th>${L('Pire', 'Worst')}</th></tr></thead>
      <tbody>${sortedRot.map(r => {
        const vals = [1, 2, 3, 4, 5, 6].map(i => v(r, i));
        const best = vals.indexOf(Math.max(...vals)) + 1, worst = vals.indexOf(Math.min(...vals)) + 1;
        return `<tr class="click" onclick="openTeam(${r.team_id})"><td class="l sc"><b>${esc(r.name)}</b></td>
          ${vals.map(x => `<td class="heat" style="--a:${(Math.abs(x) / peak * 0.55).toFixed(2)};--c:var(${x >= 0 ? '--good' : '--bad'})">${fmt(x)}</td>`).join('')}
          <td>P${best}</td><td>P${worst}</td></tr>`;
      }).join('')}</tbody></table>
      <div class="legend">${L(`Différentiel de points (gagnés − perdus) quand le passeur est en position P1 à P6, tel que publié sur la feuille Data Volley${tr(suffix)}.
        Le total des rotations peut s'écarter de quelques points du différentiel du match : c'est le décompte de la feuille.`,
        `Point differential (won − lost) with the setter in position P1 to P6, as published on the Data Volley sheet${tr(suffix)}.
        The rotation total may differ by a few points from the match differential: that is the sheet's own count.`)}</div>`;
  };
  const redraw = draw;
  draw = () => { redraw(); drawRot(); };
  draw();
  const sorted = rows.slice().sort((a, b) => b.att_eff - a.att_eff);
  $('#ttable').innerHTML = `<table>
    <thead>${groupHeader(TCOLS, 1)}<tr><th class="l sc">${L('Équipe', 'Team')}</th>${TCOLS.map(c => `<th>${tr(c[1])}</th>`).join('')}</tr></thead>
    <tbody>${sorted.map(r => `<tr class="click" onclick="openTeam(${r.team_id})"><td class="l sc"><b>${esc(r.name)}</b></td>${TCOLS.map(c => `<td>${(c[2] || (v => v ?? '–'))(r[c[0]])}</td>`).join('')}</tr>`).join('')}
    </tbody></table><div class="legend">${L('Totaux. Cliquer une équipe pour voir ses joueurs.', 'Totals. Click a team to see its players.')}</div>`;
}
const TCOLS = [
  ['games', ['MJ', 'GP']], ['sets', 'Sets'], ['pts_won', 'Pts'], ['won_att', 'Att', null, ['Points gagnés par', 'Points won by']], ['won_blk', ['Bloc', 'Block']], ['won_srv', 'Ace'], ['won_op_err', ['Fautes adv.', 'Opp. errors']],
  ['srv_tot', 'Tot', null, ['Service', 'Serve']], ['srv_err', 'Err'], ['srv_pts', 'Ace'],
  ['rec_tot', 'Tot', null, ['Réception', 'Reception']], ['rec_err', 'Err'], ['rec_pos_pct', 'Pos%', pct], ['rec_exc_pct', 'Exc%', pct],
  ['att_tot', 'Tot', null, ['Attaque', 'Attack']], ['att_pts', 'Pts'], ['att_err', 'Err'], ['att_blo', ['Contrés', 'Blocked']], ['att_pct', 'Pts%', pct], ['att_eff', 'Eff%', pct],
  ['blk_pts', 'Pts', null, ['Bloc', 'Block']],
];
function openTeam(id) {
  pstate.team = String(id); pstate.q = '';
  document.querySelector('#tabs [data-tab=players]').click();
}

// ---------- Démarrage et changement de langue ----------
let meta = null;
function renderChrome() {
  document.documentElement.lang = lang;
  document.title = L('LNA Hommes – Statistiques', 'NLA Men – Statistics');
  $('#h1').innerHTML = L('LNA <span>Hommes</span> <small>· statistiques</small> 2026/27', 'NLA <span>Men</span> <small>· statistics</small> 2026/27');
  document.querySelectorAll('#tabs button').forEach(b => b.textContent = tr(TABS[b.dataset.tab]));
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  $('#dlg-close').setAttribute('aria-label', L('Fermer', 'Close'));
  if (meta) {
    $('#meta').textContent = L(`${meta.games_with_stats} feuilles de stats importées · ${meta.games_played}/${meta.games_total} matchs joués`,
                               `${meta.games_with_stats} stat sheets imported · ${meta.games_played}/${meta.games_total} matches played`) +
      (meta.last_game ? L(` · dernier match : ${fmtDate(meta.last_game)}`, ` · last match: ${fmtDate(meta.last_game)}`) : '') +
      (updateInfo() ? ' · ' + updateInfo() : '');
  }
}
// « vérifié à 17:05 » (ou la date si ce n'est pas aujourd'hui) et feuilles attendues
function updateInfo() {
  if (!meta) return '';
  const parts = [];
  if (meta.last_check) {
    const d = new Date(meta.last_check), today = d.toDateString() === new Date().toDateString();
    const when = (today ? '' : fmtDate(meta.last_check) + ' ') + d.toTimeString().slice(0, 5);
    parts.push(L(`vérifié ${today ? 'à' : 'le'} ${when}`, `checked ${today ? 'at' : 'on'} ${when}`));
  }
  if (meta.games_pending) parts.push(L(`${meta.games_pending} feuille(s) en attente de publication`, `${meta.games_pending} sheet(s) awaiting publication`));
  if (meta.last_error) parts.push(L('dernière vérification en erreur', 'last check failed'));
  return parts.join(' · ');
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  if (b.dataset.l === lang) return;
  lang = b.dataset.l;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  if (dlg.open) dlg.close();
  renderChrome();
  views[current]();
});
api('meta').then(m => { meta = m; renderChrome(); if (current === 'standings') renderStandings(); });
renderChrome();
const start = location.hash.slice(1);
(document.querySelector(`#tabs [data-tab="${start}"]`) || document.querySelector('#tabs button')).click();
</script>
</body>
