<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LNA Hommes – Statistiques</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1b1f24; --muted: #6a7380; --line: #e3e6ea;
    --accent: #d6001c; --accent-soft: #fde8eb; --good: #1a7f4b; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --card: #1b1e23; --ink: #e8eaed; --muted: #98a1ad; --line: #2c3138;
            --accent: #ff4d5e; --accent-soft: #3a1d22; --good: #4cc38a; --bad: #ff7a70; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: baseline; gap: 12px; padding-top: 14px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  nav { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; }
  nav button { border: 0; background: none; padding: 10px 14px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 20px 0 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  th.sort { cursor: pointer; user-select: none; }
  th.sort:hover { color: var(--ink); }
  th.active { color: var(--accent); }
  th.grp { text-align: center; border-bottom: 2px solid var(--line); }
  td.l, th.l { text-align: left; }
  tbody tr:hover { background: var(--accent-soft); }
  tr.click { cursor: pointer; }
  .num { color: var(--muted); }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .muted { color: var(--muted); }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .game:hover { border-color: var(--accent); }
  .game .date { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .game .row { display: flex; justify-content: space-between; gap: 8px; }
  .game .win { font-weight: 700; }
  .game .sets { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; }
  .week { margin: 18px 0 8px; font-weight: 600; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(1100px, 96vw); max-height: 92vh; background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: start; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 2; }
  .dlg-body { padding: 16px 18px; }
  .x { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  .score { font-size: 26px; font-weight: 700; }
  h3 { margin: 18px 0 8px; font-size: 15px; }
  a { color: var(--accent); }
  .legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .leaders { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .leaders .card { margin: 0; padding: 14px 16px 10px; }
  .leaders h2 { font-size: 15px; margin: 0; }
  .leaders .crit { font-size: 12px; color: var(--muted); margin: 2px 0 8px; min-height: 1em; }
  .lrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .lrow:hover .lname { color: var(--accent); }
  .lrow .rk { color: var(--muted); font-variant-numeric: tabular-nums; }
  .lrow .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .lteam { font-size: 12px; color: var(--muted); }
  .lrow .lval { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .lrow .lsub { font-size: 11px; color: var(--muted); text-align: right; font-weight: 400; }
  .lrow .bar { grid-column: 2 / 4; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .lrow .bar i { display: block; height: 100%; background: var(--accent); }
  .lrow.first .lval { color: var(--accent); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top"><h1>LNA <span>Hommes</span> · statistiques 2026/27</h1><div class="meta" id="meta"></div></div>
    <nav id="tabs">
      <button data-tab="standings" class="on">Classement</button>
      <button data-tab="leaders">Stats joueurs</button>
      <button data-tab="teams">Stats équipes</button>
      <button data-tab="games">Matchs</button>
      <button data-tab="players">Joueurs</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<dialog id="dlg"><div class="dlg-head"><div id="dlg-title"></div><button class="x" onclick="dlg.close()" aria-label="Fermer">×</button></div><div class="dlg-body" id="dlg-body"></div></dialog>

<script>
const $ = s => document.querySelector(s);
const api = p => fetch('api/' + p).then(r => r.json());
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => new Date(d.replace(' ', 'T')).toLocaleDateString('fr-CH', {weekday: 'short', day: 'numeric', month: 'short'});
const fmtTime = d => d.slice(11, 16);
const pct = v => v == null ? '–' : v + '%';
// % affiché seulement s'il y a des tentatives (sinon le PDF indique 0 %)
const pctIf = tot => (v, r) => r && !r[tot] ? '<span class="muted">·</span>' : pct(v);
const sign = v => v == null ? '–' : `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${v > 0 ? '+' : ''}${v}</span>`;
const dash = v => v == null || v === 0 ? '<span class="muted">·</span>' : v;
let cache = {};
const load = async k => cache[k] ??= await api(k);

// ---------- Onglets ----------
const views = { standings: renderStandings, leaders: renderLeaders, games: renderGames, players: renderPlayers, teams: renderTeams };
$('#tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  location.hash = b.dataset.tab;
  views[b.dataset.tab]();
};

// ---------- Classement ----------
async function renderStandings() {
  const rows = await load('standings');
  $('#view').innerHTML = `<div class="card scroll"><table>
    <thead><tr><th>#</th><th class="l">Équipe</th><th>J</th><th>Pts</th><th>V</th><th>D</th><th>Sets</th><th>Q sets</th><th>Balles</th><th>Q balles</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="click" onclick="openTeam(${r.team_id})">
      <td class="num">${i + 1}</td><td class="l"><b>${esc(r.name)}</b></td><td>${r.games}</td><td><b>${r.pts}</b></td>
      <td>${r.w}</td><td>${r.l}</td><td>${r.sets_w}:${r.sets_l}</td><td>${(r.sets_w / Math.max(r.sets_l, 1)).toFixed(2)}</td>
      <td>${r.balls_w}:${r.balls_l}</td><td>${(r.balls_w / Math.max(r.balls_l, 1)).toFixed(2)}</td></tr>`).join('')}
    </tbody></table>
    <div class="legend">Calculé à partir des résultats importés. 3-0 / 3-1 : 3 pts · 3-2 : 2 pts · 2-3 : 1 pt.</div></div>`;
}

// ---------- Matchs ----------
async function renderGames() {
  const games = await load('games');
  const weeks = {};
  for (const g of games) {
    const d = new Date(g.play_date.slice(0, 10)); const monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    (weeks[monday.toISOString().slice(0, 10)] ??= []).push(g);
  }
  const played = g => g.home_sets != null;
  $('#view').innerHTML = `<div class="toolbar"><div class="chips">
      <button class="chip on" data-f="all">Tous</button><button class="chip" data-f="played">Joués</button><button class="chip" data-f="next">À venir</button></div></div>
    <div id="glist"></div>`;
  const draw = f => {
    $('#glist').innerHTML = Object.entries(weeks).map(([w, gs]) => {
      gs = gs.filter(g => f === 'all' || (f === 'played') === played(g));
      if (!gs.length) return '';
      return `<div class="week">Semaine du ${new Date(w).toLocaleDateString('fr-CH', {day: 'numeric', month: 'long'})}</div><div class="games">${gs.map(g => {
        const sets = JSON.parse(g.set_results || '[]');
        const hw = g.home_sets > g.away_sets;
        return `<div class="game" onclick="${played(g) ? `openGame(${g.game_id})` : ''}">
          <div class="date">${fmtDate(g.play_date)} · ${fmtTime(g.play_date)} · ${esc(g.city || '')}${g.stats_status === 'ok' ? '<span class="tag">stats</span>' : ''}</div>
          <div class="row ${played(g) && hw ? 'win' : ''}"><span>${esc(g.home)}</span><span>${g.home_sets ?? ''}</span></div>
          <div class="row ${played(g) && !hw ? 'win' : ''}"><span>${esc(g.away)}</span><span>${g.away_sets ?? ''}</span></div>
          ${sets.length ? `<div class="sets">${sets.map(s => s.join('-')).join(' · ')}</div>` : ''}</div>`;
      }).join('')}</div>`;
    }).join('') || '<div class="empty">Aucun match</div>';
  };
  document.querySelectorAll('.chip[data-f]').forEach(c => c.onclick = () => {
    document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.toggle('on', x === c)); draw(c.dataset.f);
  });
  draw('all');
}

// Colonnes du tableau de stats d'un match (feuille officielle)
const BOX = [
  ['pts_tot', 'Pts'], ['bp', 'BP'], ['wl', 'V-D', sign],
  ['srv_tot', 'Tot', null, 'Service'], ['srv_err', 'Err'], ['srv_pts', 'Ace'],
  ['rec_tot', 'Tot', null, 'Réception'], ['rec_err', 'Err'], ['rec_pos_pct', 'Pos%', pctIf('rec_tot')], ['rec_exc_pct', 'Exc%', pctIf('rec_tot')],
  ['att_tot', 'Tot', null, 'Attaque'], ['att_err', 'Err'], ['att_blo', 'Blo'], ['att_pts', 'Pts'], ['att_pct', 'Pts%', pctIf('att_tot')],
  ['blk_pts', 'Pts', null, 'Bloc'],
];
function groupHeader(cols, lead) {
  const groups = []; for (const c of cols) { if (c[3] || !groups.length) groups.push([c[3] || '', 0]); groups.at(-1)[1]++; }
  return `<tr><th colspan="${lead}"></th>${groups.map(([n, k]) => `<th class="grp" colspan="${k}">${n}</th>`).join('')}</tr>`;
}

async function openGame(id) {
  const g = await api('games/' + id);
  const sets = JSON.parse(g.set_results || '[]');
  $('#dlg-title').innerHTML = `<div class="muted">${fmtDate(g.play_date)} ${fmtTime(g.play_date)} · ${esc(g.hall || '')}, ${esc(g.city || '')}</div>
    <div class="score">${esc(g.home)} ${g.home_sets} : ${g.away_sets} ${esc(g.away)}</div>
    <div class="muted">${sets.map(s => s.join('-')).join(' · ')}${g.referees ? ' · Arbitres : ' + esc(g.referees) : ''}</div>`;
  if (g.stats_status !== 'ok') {
    $('#dlg-body').innerHTML = '<div class="empty">Feuille de statistiques pas encore disponible.</div>'; return dlg.showModal();
  }
  const side = (tid, name) => {
    const ps = g.players.filter(p => p.team_id === tid && (p.pts_tot || p.srv_tot || p.rec_tot || p.att_tot || p.sets_played));
    const tot = g.team_sets.find(t => t.team_id === tid && t.set_no === 0);
    const perSet = g.team_sets.filter(t => t.team_id === tid && t.set_no > 0);
    return `<h3>${esc(name)}</h3><div class="scroll"><table>
      <thead>${groupHeader(BOX, 4)}<tr><th>N°</th><th class="l">Joueur</th><th>Sets</th><th>Note</th>${BOX.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead>
      <tbody>${ps.map(p => `<tr class="click" onclick="openPlayer(${p.player_id})"><td class="num">${p.number}${p.libero ? ' L' : ''}</td>
        <td class="l">${esc(p.name)}</td><td>${p.sets_played || '<span class="muted">·</span>'}</td><td>${p.vote ?? '<span class="muted">·</span>'}</td>
        ${BOX.map(c => `<td>${(c[2] || dash)(p[c[0]], p)}</td>`).join('')}</tr>`).join('')}
      <tr><td></td><td class="l"><b>Total</b></td><td></td><td></td>${BOX.map(c => `<td><b>${(c[2] || (v => v ?? 0))(tot[c[0]])}</b></td>`).join('')}</tr>
      ${perSet.map(s => `<tr class="muted"><td></td><td class="l">Set ${s.set_no} <span class="muted">(pts : ${s.won_srv} serv · ${s.won_att} att · ${s.won_blk} bloc · ${s.won_op_err} fautes adv.)</span></td><td></td><td></td>
        <td></td><td></td><td></td>${BOX.slice(3).map(c => `<td>${(c[2] || dash)(s[c[0]], s)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
  };
  $('#dlg-body').innerHTML = side(g.home_team_id, g.home) + side(g.away_team_id, g.away) +
    `<div class="legend">BP : points en break-point · V-D : points gagnés − perdus · Pos% : réceptions positives (#+) · Exc% : parfaites (#) · Blo : attaques contrées.
     <a href="pdf/${g.game_id}" target="_blank">Feuille officielle (PDF)</a></div>`;
  dlg.showModal();
}

// ---------- Joueurs ----------
const PCOLS = {
  general: [['games', 'MJ'], ['sets', 'Sets'], ['pts', 'Pts'], ['pts_s', 'Pts/set'], ['bp', 'BP'], ['wl', 'V-D', sign], ['att_pts', 'Att'], ['srv_pts', 'Aces'], ['blk_pts', 'Blocs'], ['vote', 'Note']],
  attack: [['sets', 'Sets'], ['att_tot', 'Tot'], ['att_pts', 'Pts'], ['att_s', 'Pts/set'], ['att_err', 'Err'], ['att_blo', 'Contrés'], ['att_pct', 'Pts%', pct], ['att_eff', 'Eff%', pct]],
  serve: [['sets', 'Sets'], ['srv_tot', 'Tot'], ['srv_pts', 'Aces'], ['ace_s', 'Aces/set'], ['srv_err', 'Err'], ['ace_pct', 'Ace%', pct], ['err_pct', 'Err%', pct]],
  reception: [['sets', 'Sets'], ['rec_tot', 'Tot'], ['rec_err', 'Err'], ['rec_pos_pct', 'Pos%', pct], ['rec_exc_pct', 'Exc%', pct], ['rec_err_pct', 'Err%', pct]],
  block: [['games', 'MJ'], ['sets', 'Sets'], ['blk_pts', 'Blocs'], ['blk_s', 'Blocs/set']],
};
const PMIN = { attack: ['att_tot', 20], serve: ['srv_tot', 15], reception: ['rec_tot', 20] };
const PDEF = { general: 'pts', attack: 'att_eff', serve: 'srv_pts', reception: 'rec_pos_pct', block: 'blk_pts' };
const pstate = { cat: 'general', sort: 'pts', dir: -1, team: '', q: '', min: true };

// ---------- Classements statistiques (toute la ligue) ----------
// count : statistique cumulable, affichée en total, par set ou par match selon le mode.
// vol : colonne de volume pour les % (au moins VOL_SHARE du volume du leader de la ligue).
// Hors totaux, un joueur doit en plus avoir joué une part minimale des sets de son équipe.
const VOL_SHARE = 0.4;
const fix = d => v => v == null ? '–' : v.toFixed(d);
const LEADERS = [
  { t: 'Points', k: 'pts', count: true, sub: r => `${r.pts} pts : ${r.att_pts} att · ${r.srv_pts} aces · ${r.blk_pts} contres` },
  { t: 'Points en attaque', k: 'att_pts', count: true, sub: r => `${r.att_pts} pts sur ${r.att_tot} attaques` },
  { t: 'Efficacité en attaque', k: 'att_eff', f: pct, vol: 'att_tot', sub: r => `${r.att_pts} pts · ${r.att_err + r.att_blo} fautes/contrés · ${r.att_tot} att.` },
  { t: 'Réussite en attaque', k: 'att_pct', f: pct, vol: 'att_tot', sub: r => `${r.att_pts}/${r.att_tot}` },
  { t: 'Aces', k: 'srv_pts', count: true, sub: r => `${r.srv_pts} aces · ${r.srv_tot} services · ${r.srv_err} fautes` },
  { t: 'Points au contre', k: 'blk_pts', count: true, sub: r => `${r.blk_pts} contres` },
  { t: 'Réception positive', k: 'rec_pos_pct', f: pct, vol: 'rec_tot', sub: r => `${r.rec_tot} réceptions · ${r.rec_err} fautes` },
  { t: 'Réception parfaite', k: 'rec_exc_pct', f: pct, vol: 'rec_tot', sub: r => `${r.rec_tot} réceptions` },
  { t: 'Points en break-point', k: 'bp', count: true, sub: r => `${r.bp} BP sur ${r.pts} pts` },
  { t: 'Différentiel V-D', k: 'wl', count: true, signed: true, sub: r => `${r.wl > 0 ? '+' : ''}${r.wl} au total` },
  { t: 'Note moyenne Data Volley', k: 'vote', f: fix(1), sub: () => '' },
];
const VOL = { att_tot: 'attaques', rec_tot: 'réceptions' };
const MODES = { total: ['Totaux', '', null], set: ['Par set', ' par set', 'sets'], match: ['Par match', ' par match', 'games'] };
const lstate = { top: 10, team: '', mode: 'set', part: 0.5 };

async function renderLeaders() {
  const [all, teams] = await Promise.all([loadPlayers(), load('standings')]);
  $('#view').innerHTML = `<div class="toolbar">
      <div class="chips" id="lmode">${Object.entries(MODES).map(([k, m]) => `<button class="chip ${lstate.mode === k ? 'on' : ''}" data-m="${k}">${m[0]}</button>`).join('')}</div>
      <select id="lteam"><option value="">Toute la LNA</option>${teams.map(t => `<option value="${t.team_id}" ${lstate.team == t.team_id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
      <label class="muted">Minimum <select id="lpart">${[[0, 'aucun'], [0.25, '25 %'], [0.5, '50 %'], [0.75, '75 %']]
        .map(([v, n]) => `<option value="${v}" ${lstate.part === v ? 'selected' : ''}>${n}</option>`).join('')}</select> des sets de l'équipe</label>
      <div class="chips" id="ltop">${[5, 10, 20].map(n => `<button class="chip ${lstate.top === n ? 'on' : ''}" data-n="${n}">Top ${n}</button>`).join('')}</div>
    </div><div class="leaders" id="lgrid"></div>
    <div class="legend">Sets joués = sets commencés comme titulaire ou entrés en remplacement (feuille officielle) ; un libéro sans marque est compté sur tout le match.
      Hors totaux, un joueur doit avoir joué la part minimale choisie des sets disputés par son équipe ; les classements en % exigent en plus
      ${Math.round(VOL_SHARE * 100)} % du volume du joueur le plus sollicité de la ligue. Efficacité en attaque = (points − fautes − contrés) / attaques.</div>`;
  const draw = () => {
    const [, suffix, denom] = MODES[lstate.mode];
    $('#lgrid').innerHTML = LEADERS.map(c => {
      const rate = c.count && denom;
      const val = r => rate ? r[c.k] / Math.max(r[denom], 1) : r[c.k];
      const f = rate ? (v => (c.signed && v > 0 ? '+' : '') + v.toFixed(denom === 'sets' ? 2 : 1)) : c.signed ? sign : (c.f || (v => v));
      const needPart = !(c.count && lstate.mode === 'total');
      // Seuils calculés sur toute la ligue, même quand on filtre une équipe
      const volMin = c.vol ? Math.ceil(VOL_SHARE * Math.max(...all.map(r => r[c.vol] || 0))) : 0;
      const list = all.filter(r => r[c.k] != null && (!lstate.team || r.team_id == lstate.team)
          && (!needPart || r.sets >= lstate.part * r.team_sets) && (!c.vol || r[c.vol] >= volMin))
        .map(r => ({ r, v: val(r) })).sort((a, b) => b.v - a.v || b.r.sets - a.r.sets).slice(0, lstate.top);
      const max = Math.max(...list.map(x => x.v), 1e-9);
      const crit = [needPart && lstate.part ? `${Math.round(lstate.part * 100)} % des sets de l'équipe` : '', c.vol ? `${volMin} ${VOL[c.vol]}` : '']
        .filter(Boolean).join(' · ');
      return `<div class="card"><h2>${c.t}${c.count ? suffix : ''}</h2><div class="crit">${crit ? 'min. ' + crit : ''}</div>
        ${list.map(({ r, v }, i) => `<div class="lrow${i ? '' : ' first'}" onclick="openPlayer(${r.player_id})">
          <span class="rk">${i + 1}</span>
          <span class="lname"><b>${esc(r.name)}</b> <span class="lteam">${esc(r.team)}</span></span>
          <span class="lval">${f(v)}</span>
          <span></span><span class="lsub" style="grid-column: 2 / 4">${[c.sub(r), `${r.sets}/${r.team_sets} sets · ${r.games} m.`].filter(Boolean).join(' · ')}</span>
          <span class="bar"><i style="width:${Math.max(0, 100 * v / max)}%"></i></span>
        </div>`).join('') || '<div class="empty">Aucun joueur</div>'}</div>`;
    }).join('');
  };
  $('#lteam').onchange = e => { lstate.team = e.target.value; draw(); };
  $('#lpart').onchange = e => { lstate.part = +e.target.value; draw(); };
  const chips = (sel, attr, apply) => document.querySelectorAll(`${sel} .chip`).forEach(c => c.onclick = () => {
    apply(c.dataset[attr]); document.querySelectorAll(`${sel} .chip`).forEach(x => x.classList.toggle('on', x === c)); draw();
  });
  chips('#lmode', 'm', v => lstate.mode = v);
  chips('#ltop', 'n', v => lstate.top = +v);
  draw();
}

// Ratios dérivés, calculés une fois sur la liste mise en cache
async function loadPlayers() {
  const rows = await load('players');
  if (!rows.enriched) {
    for (const r of rows) {
      const s = Math.max(r.sets, 1);
      r.pts_s = +(r.pts / s).toFixed(2); r.att_s = +(r.att_pts / s).toFixed(2);
      r.ace_s = +(r.srv_pts / s).toFixed(2); r.blk_s = +(r.blk_pts / s).toFixed(2);
      r.ace_pct = r.srv_tot ? Math.round(100 * r.srv_pts / r.srv_tot) : null;
      r.err_pct = r.srv_tot ? Math.round(100 * r.srv_err / r.srv_tot) : null;
      r.rec_err_pct = r.rec_tot ? Math.round(100 * r.rec_err / r.rec_tot) : null;
    }
    rows.enriched = true;
  }
  return rows;
}

async function renderPlayers() {
  const [rows, teams] = await Promise.all([loadPlayers(), load('standings')]);
  $('#view').innerHTML = `<div class="card"><div class="toolbar">
      <div class="chips">${[['general', 'Général'], ['attack', 'Attaque'], ['serve', 'Service'], ['reception', 'Réception'], ['block', 'Bloc']]
        .map(([k, n]) => `<button class="chip ${pstate.cat === k ? 'on' : ''}" data-c="${k}">${n}</button>`).join('')}</div>
      <select id="pteam"><option value="">Toutes les équipes</option>${teams.map(t => `<option value="${t.team_id}" ${pstate.team == t.team_id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
      <input id="pq" placeholder="Rechercher un joueur" value="${esc(pstate.q)}">
      <label class="muted" id="pminl"><input type="checkbox" id="pmin" ${pstate.min ? 'checked' : ''}> volume minimum</label>
    </div><div class="scroll" id="ptable"></div></div>`;
  const draw = () => {
    const cols = PCOLS[pstate.cat], min = PMIN[pstate.cat];
    $('#pminl').style.display = min ? '' : 'none';
    let list = rows.filter(r => (!pstate.team || r.team_id == pstate.team) && r.name.toLowerCase().includes(pstate.q.toLowerCase()));
    if (min && pstate.min) list = list.filter(r => r[min[0]] >= min[1]);
    list.sort((a, b) => ((a[pstate.sort] ?? -1e9) - (b[pstate.sort] ?? -1e9)) * pstate.dir || a.name.localeCompare(b.name));
    $('#ptable').innerHTML = `<table><thead><tr><th>#</th><th class="l">Joueur</th><th class="l">Équipe</th>
      ${cols.map(c => `<th class="sort ${pstate.sort === c[0] ? 'active' : ''}" data-s="${c[0]}">${c[1]}${pstate.sort === c[0] ? (pstate.dir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead>
      <tbody>${list.map((r, i) => `<tr class="click" onclick="openPlayer(${r.player_id})"><td class="num">${i + 1}</td>
        <td class="l"><b>${esc(r.name)}</b> <span class="muted">${r.number ?? ''}${r.libero ? ' L' : ''}</span></td><td class="l muted">${esc(r.team)}</td>
        ${cols.map(c => `<td>${(c[2] || (v => v ?? '–'))(r[c[0]])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="20" class="empty">Aucun joueur</td></tr>`}
      </tbody></table>
      ${min && pstate.min ? `<div class="legend">Volume minimum : ${min[1]} ${({att_tot: 'attaques', srv_tot: 'services', rec_tot: 'réceptions'})[min[0]]}.</div>` : ''}
      <div class="legend">Eff% attaque = (points − erreurs − contrés) / tentatives. Pos%/Exc% réception pondérés par le nombre de réceptions.</div>`;
    document.querySelectorAll('#ptable th.sort').forEach(th => th.onclick = () => {
      pstate.dir = pstate.sort === th.dataset.s ? -pstate.dir : -1; pstate.sort = th.dataset.s; draw();
    });
  };
  document.querySelectorAll('.chip[data-c]').forEach(c => c.onclick = () => {
    pstate.cat = c.dataset.c; pstate.sort = PDEF[pstate.cat]; pstate.dir = -1;
    document.querySelectorAll('.chip[data-c]').forEach(x => x.classList.toggle('on', x === c)); draw();
  });
  $('#pteam').onchange = e => { pstate.team = e.target.value; draw(); };
  $('#pq').oninput = e => { pstate.q = e.target.value; draw(); };
  $('#pmin').onchange = e => { pstate.min = e.target.checked; draw(); };
  draw();
}

async function openPlayer(id) {
  const p = await api('players/' + id);
  $('#dlg-title').innerHTML = `<div class="score">${esc(p.name)}</div><div class="muted">${esc(p.team)}</div>`;
  const tot = k => p.games.reduce((s, g) => s + (g[k] || 0), 0);
  $('#dlg-body').innerHTML = `<div class="scroll"><table>
    <thead>${groupHeader(BOX, 4)}<tr><th class="l">Date</th><th class="l">Adversaire</th><th>Sets</th><th>Note</th>${BOX.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead>
    <tbody>${p.games.map(g => {
      const home = g.home_team_id === g.team_id, my = home ? g.home_sets : g.away_sets, their = home ? g.away_sets : g.home_sets;
      return `<tr class="click" onclick="openGame(${g.game_id})"><td class="l">${fmtDate(g.play_date)}</td>
        <td class="l">${home ? '' : '@ '}${esc(g.opponent)} <span class="${my > their ? 'pos' : 'neg'}">${my}-${their}</span></td>
        <td>${g.sets_played || '<span class="muted">·</span>'}</td><td>${g.vote ?? '<span class="muted">·</span>'}</td>
        ${BOX.map(c => `<td>${(c[2] || dash)(g[c[0]], g)}</td>`).join('')}</tr>`;
    }).join('')}
    <tr><td class="l"><b>Total</b></td><td></td><td><b>${tot('sets_played')}</b></td><td></td>${BOX.map(c => `<td><b>${c[2] ? '' : tot(c[0])}</b></td>`).join('')}</tr>
    </tbody></table></div>`;
  dlg.showModal();
}

// ---------- Stats équipes ----------
// count : cumulable (total / par set / par match) ; asc : plus c'est bas, mieux c'est
const TLEAD = [
  { t: 'Points marqués', k: 'pts_won', count: true, sub: r => `${r.won_att} att · ${r.won_blk} contres · ${r.won_srv} aces · ${r.won_op_err} fautes adv.` },
  { t: 'Différentiel de points', k: 'diff', count: true, signed: true, sub: r => `${r.pts_won} marqués · ${r.pts_lost} concédés` },
  { t: 'Efficacité en attaque', k: 'att_eff', f: pct, sub: r => `${r.att_pts} pts · ${r.att_err + r.att_blo} fautes/contrés · ${r.att_tot} att.` },
  { t: 'Réussite en attaque', k: 'att_pct', f: pct, sub: r => `${r.att_pts}/${r.att_tot}` },
  { t: 'Points au contre', k: 'won_blk', count: true, sub: r => `${r.won_blk} contres` },
  { t: 'Aces', k: 'won_srv', count: true, sub: r => `${r.won_srv} aces sur ${r.srv_tot} services` },
  { t: 'Fautes de service', k: 'srv_err_pct', f: pct, asc: true, sub: r => `${r.srv_err} fautes sur ${r.srv_tot} services` },
  { t: 'Réception positive', k: 'rec_pos_pct', f: pct, sub: r => `${r.rec_tot} réceptions · ${r.rec_err} fautes` },
  { t: 'Réception parfaite', k: 'rec_exc_pct', f: pct, sub: r => `${r.rec_tot} réceptions` },
  { t: 'Attaque adverse (défense + contre)', k: 'opp_att_eff', f: pct, asc: true, sub: r => `efficacité adverse · ${r.opp_att_tot} attaques subies` },
  { t: 'Fautes directes offertes', k: 'err_given', count: true, asc: true, sub: r => `${r.err_given} points donnés à l'adversaire` },
  { t: 'Points en break-point', k: 'bp', count: true, sub: r => `${r.bp} BP` },
];
const tstate = { mode: 'set' };

async function renderTeams() {
  const rows = await load('teams');
  for (const r of rows) {
    r.diff = r.pts_won - r.pts_lost;
    r.srv_err_pct = r.srv_tot ? Math.round(100 * r.srv_err / r.srv_tot) : null;
    r.opp_att_eff = r.opp_att_tot ? Math.round(100 * (r.opp_att_pts - r.opp_att_fail) / r.opp_att_tot) : null;
  }
  $('#view').innerHTML = `<div class="toolbar"><div class="chips" id="tmode">${Object.entries(MODES)
      .map(([k, m]) => `<button class="chip ${tstate.mode === k ? 'on' : ''}" data-m="${k}">${m[0]}</button>`).join('')}</div></div>
    <div class="leaders" id="tgrid"></div>
    <div class="legend">Calculé sur les feuilles de statistiques importées. Points marqués et concédés = « balles » du classement officiel.
      Fautes directes offertes = points marqués par l'adversaire sur nos fautes (service, attaque, filet…). Attaque adverse : plus c'est bas, meilleure est la défense.</div>
    <h3>Tableau complet</h3><div class="card scroll" id="ttable"></div>`;
  const draw = () => {
    const [, suffix, denom] = MODES[tstate.mode];
    $('#tgrid').innerHTML = TLEAD.map(c => {
      const rate = c.count && denom;
      const val = r => rate ? r[c.k] / Math.max(r[denom], 1) : r[c.k];
      const f = rate ? (v => (c.signed && v > 0 ? '+' : '') + v.toFixed(denom === 'sets' ? 2 : 1)) : c.signed ? sign : (c.f || (v => v));
      const list = rows.filter(r => r[c.k] != null).map(r => ({ r, v: val(r) })).sort((a, b) => (c.asc ? a.v - b.v : b.v - a.v));
      const lo = Math.min(0, ...list.map(x => x.v)), hi = Math.max(...list.map(x => x.v), 1e-9);
      // Barre : meilleure équipe = barre pleine, y compris pour les stats « plus bas = mieux »
      const width = v => c.asc ? 100 * Math.min(...list.map(x => x.v)) / Math.max(v, 1e-9) : 100 * (v - lo) / Math.max(hi - lo, 1e-9);
      return `<div class="card"><h2>${c.t}${c.count ? suffix : ''}</h2><div class="crit">${c.asc ? 'plus bas = mieux' : ''}</div>
        ${list.map(({ r, v }, i) => `<div class="lrow${i ? '' : ' first'}" onclick="openTeam(${r.team_id})">
          <span class="rk">${i + 1}</span><span class="lname"><b>${esc(r.name)}</b></span><span class="lval">${f(v)}</span>
          <span></span><span class="lsub" style="grid-column: 2 / 4">${c.sub(r)} · ${r.sets} sets · ${r.games} m.</span>
          <span class="bar"><i style="width:${Math.max(0, width(v))}%"></i></span></div>`).join('')}</div>`;
    }).join('');
  };
  document.querySelectorAll('#tmode .chip').forEach(c => c.onclick = () => {
    tstate.mode = c.dataset.m; document.querySelectorAll('#tmode .chip').forEach(x => x.classList.toggle('on', x === c)); draw();
  });
  draw();
  const sorted = rows.slice().sort((a, b) => b.att_eff - a.att_eff);
  $('#ttable').innerHTML = `<table>
    <thead>${groupHeader(TCOLS, 1)}<tr><th class="l">Équipe</th>${TCOLS.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead>
    <tbody>${sorted.map(r => `<tr class="click" onclick="openTeam(${r.team_id})"><td class="l"><b>${esc(r.name)}</b></td>${TCOLS.map(c => `<td>${(c[2] || (v => v ?? '–'))(r[c[0]])}</td>`).join('')}</tr>`).join('')}
    </tbody></table><div class="legend">Totaux. Cliquer une équipe pour voir ses joueurs.</div>`;
}
const TCOLS = [
  ['games', 'MJ'], ['sets', 'Sets'], ['pts_won', 'Pts'], ['won_att', 'Att', null, 'Points gagnés par'], ['won_blk', 'Bloc'], ['won_srv', 'Ace'], ['won_op_err', 'Fautes adv.'],
  ['srv_tot', 'Tot', null, 'Service'], ['srv_err', 'Err'], ['srv_pts', 'Ace'],
  ['rec_tot', 'Tot', null, 'Réception'], ['rec_err', 'Err'], ['rec_pos_pct', 'Pos%', pct], ['rec_exc_pct', 'Exc%', pct],
  ['att_tot', 'Tot', null, 'Attaque'], ['att_pts', 'Pts'], ['att_err', 'Err'], ['att_blo', 'Contrés'], ['att_pct', 'Pts%', pct], ['att_eff', 'Eff%', pct],
  ['blk_pts', 'Pts', null, 'Bloc'],
];
function openTeam(id) {
  pstate.team = String(id); pstate.q = '';
  document.querySelector('#tabs [data-tab=players]').click();
}

// ---------- Démarrage ----------
api('meta').then(m => {
  $('#meta').textContent = `${m.games_with_stats} feuilles de stats importées · ${m.games_played}/${m.games_total} matchs joués` +
    (m.last_game ? ` · dernier match : ${fmtDate(m.last_game)}` : '');
});
const start = location.hash.slice(1);
(document.querySelector(`#tabs [data-tab="${start}"]`) || document.querySelector('#tabs button')).click();
</script>
